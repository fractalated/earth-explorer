<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<style>
  :root {
    --panel: rgba(18, 22, 30, 0.92);
    --panel-edge: rgba(255, 255, 255, 0.10);
    --text: #eef1f5;
    --muted: #9aa4b2;
    --accent: #f5c542;
    --hover: rgba(255, 255, 255, 0.07);
    --active: rgba(245, 197, 66, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #globe { position: absolute; inset: 0; }

  #panel { position: absolute; top: 12px; left: 12px; bottom: 12px; width: 290px;
    display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--panel-edge); border-radius: 12px; backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 2; }
  #panel header { padding: 16px 16px 10px; border-bottom: 1px solid var(--panel-edge); }
  #panel .brand { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  #panel h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  #panel .sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .row { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--panel-edge); flex-wrap: wrap; }
  button, .filebtn { font: inherit; font-size: 13px; color: var(--text); background: rgba(255,255,255,.08);
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  button:hover, .filebtn:hover { background: rgba(255,255,255,.14); }

  #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #list li button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    background: transparent; border: 1px solid transparent; padding: 8px 8px; font-size: 14px; }
  #list li button:hover { background: var(--hover); }
  #list li button.active { background: var(--active); border-color: rgba(245,197,66,.45); }
  .num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #222;
    font-size: 12px; font-weight: 700; display: grid; place-items: center; }

  #info { padding: 12px 16px; border-top: 1px solid var(--panel-edge); font-size: 13px; min-height: 92px; }
  #info h2 { margin: 0 0 6px; font-size: 15px; }
  #info .k { color: var(--muted); }
  #info .desc { margin-top: 6px; line-height: 1.4; }
  #info .desc img { max-width: 100%; }
  #info .hint { color: var(--muted); line-height: 1.45; }
  footer { padding: 8px 16px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--panel-edge); line-height: 1.4; }
  .filebtn input { display: none; }
  #toggle-panel { display: none; }

  #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3;
    background: var(--panel); border: 1px solid var(--panel-edge); padding: 14px 18px; border-radius: 10px;
    font-size: 14px; max-width: 80vw; text-align: center; }
  #status[hidden] { display: none; }

  #viewctl { position: absolute; top: 12px; right: 12px; width: 260px; z-index: 2; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px;
    backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(0,0,0,.45); font-size: 13px; }
  #viewctl .vc-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; }
  #viewctl .vc-row { display: grid; grid-template-columns: 52px 1fr 44px; align-items: center; gap: 8px; margin-bottom: 8px; }
  #viewctl .vc-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  #viewctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  #viewctl .vc-btns { display: flex; gap: 6px; }
  #viewctl .vc-btns button { flex: 1; padding: 6px 8px; }

  /* keep Cesium's credits readable but out of the way */
  .cesium-viewer-bottom { left: 314px !important; }
  .cesium-widget-credits { font-size: 10px; }

  @media (max-width: 720px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 48vh; }
    #panel.collapsed #list, #panel.collapsed .row, #panel.collapsed footer { display: none; }
    #toggle-panel { display: inline-block; float: right; margin-top: -2px; }
    .cesium-viewer-bottom { left: 8px !important; bottom: calc(48vh + 12px) !important; }
    #viewctl { top: 8px; right: 8px; left: 8px; width: auto; }
  }
</style>
</head>
<body>
<div id="globe"></div>

<aside id="panel">
  <header>
    <button id="toggle-panel" aria-label="Show or hide the pin list">Hide</button>
    <div class="brand">🌎 Earth Explorer</div>
    <h1 id="tour-title">No tour loaded</h1>
    <div class="sub">Drag to spin · Scroll or pinch to zoom · Ctrl + drag to tilt</div>
  </header>
  <div class="row">
    <button id="home">🌍 Whole Earth</button>
    <label class="filebtn" title="Open a different Google Earth file">📂 Open KMZ…
      <input id="file" type="file" accept=".kmz,.kml">
    </label>
  </div>
  <ol id="list" aria-label="Places in this tour"></ol>
  <div id="info"><div class="hint">Use <b>Open KMZ…</b> to load a .kmz or .kml file saved from Google Earth.</div></div>
  <footer>Imagery &amp; elevation: Esri, Maxar, Earthstar Geographics. Globe: CesiumJS.</footer>
</aside>

<div id="viewctl" aria-label="Viewing angle">
  <div class="vc-title">Viewing angle</div>
  <label class="vc-row"><span>Tilt</span><input id="tilt" type="range" min="0" max="75" step="1" value="0"><span class="vc-val" id="tilt-val">0°</span></label>
  <label class="vc-row"><span>Rotate</span><input id="heading" type="range" min="-180" max="180" step="1" value="0"><span class="vc-val" id="heading-val">N</span></label>
  <div class="vc-btns">
    <button id="north-up" title="Turn the view so north is at the top">⬆ North up</button>
    <button id="reset-view" title="North up and the standard viewing angle">↺ Reset view</button>
  </div>
</div>

<div id="status">Loading the globe…</div>

<script>
(async function () {
  const statusEl = document.getElementById('status');
  const show = (msg) => { statusEl.textContent = msg; statusEl.hidden = !msg; };

  if (!window.Cesium) {
    show('The globe could not load. Your school\'s web filter may be blocking cdn.jsdelivr.net.');
    return;
  }

  const IMAGERY = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer';
  const LABELS  = 'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer';
  // Land elevation + ocean-floor depth (so trenches and ridges show in 3D)
  const TERRAIN = 'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/TopoBathy3D/ImageServer';

  let terrainProvider;
  try { terrainProvider = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(TERRAIN); }
  catch (err) { console.warn('3D terrain unavailable; using a smooth globe.', err); terrainProvider = new Cesium.EllipsoidTerrainProvider(); }
  const hasTerrain = !(terrainProvider instanceof Cesium.EllipsoidTerrainProvider);

  const viewer = new Cesium.Viewer('globe', {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(Cesium.ArcGisMapServerImageryProvider.fromUrl(IMAGERY)),
    terrainProvider,
    baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
    navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false
  });
  viewer.imageryLayers.addImageryProvider(await Cesium.ArcGisMapServerImageryProvider.fromUrl(LABELS));
  viewer.scene.globe.depthTestAgainstTerrain = true;
  viewer.scene.screenSpaceCameraController.enableCollisionDetection = true;

  const WHOLE_EARTH = Cesium.Cartesian3.fromDegrees(-110, 25, 20000000);
  viewer.camera.setView({ destination: WHOLE_EARTH });

  // ---------- Tour (KML / KMZ) ----------
  const pinBuilder = new Cesium.PinBuilder();
  const pinColor = Cesium.Color.fromCssColorString('#f5c542');
  let tourSource = null;
  let pins = [];
  const heightCache = new Map();   // entity -> Promise<ground elevation in m>
  const groundHeight = new Map();  // entity -> ground elevation once known
  const groundOf = new Map();      // entity -> Cartographic where the pin meets the ground

  // Flag poles grow with viewing distance so the flag always clears nearby hills,
  // whether you are looking at the whole Earth or standing next to a volcano.
  function poleLength(basePos) {
    const d = Cesium.Cartesian3.distance(viewer.camera.positionWC, basePos);
    return Cesium.Math.clamp(d * 0.07, 15, 300000);
  }
  function makePositionCallback(fn) {
    return Cesium.CallbackPositionProperty
      ? new Cesium.CallbackPositionProperty(fn, false)
      : new Cesium.CallbackProperty(fn, false);
  }

  async function loadTour(data) {
    show('Loading places…');
    try {
      const ds = await Cesium.KmlDataSource.load(data, {
        camera: viewer.scene.camera, canvas: viewer.scene.canvas, clampToGround: true
      });
      if (tourSource) viewer.dataSources.remove(tourSource, true);
      tourSource = ds;
      await viewer.dataSources.add(ds);

      pins = ds.entities.values.filter(e => e.position && (e.billboard || e.point));
      pins.forEach((e, i) => {
        // Remember where the pin touches the ground, then stand a flag pole straight up from there.
        const ground = Cesium.Cartographic.fromCartesian(e.position.getValue(Cesium.JulianDate.now()));
        ground.height = 0;
        groundOf.set(e, ground);
        const base = () => Cesium.Cartesian3.fromRadians(ground.longitude, ground.latitude, groundHeight.get(e) || 0);
        const top = () => {
          const b = base();
          return Cesium.Cartesian3.fromRadians(ground.longitude, ground.latitude,
            (groundHeight.get(e) || 0) + poleLength(b));
        };
        e.position = makePositionCallback(top);
        e.polyline = new Cesium.PolylineGraphics({
          positions: new Cesium.CallbackProperty(() => [base(), top()], false),
          width: 3, arcType: Cesium.ArcType.NONE,
          material: new Cesium.PolylineOutlineMaterialProperty({
            color: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK.withAlpha(0.7), outlineWidth: 1
          })
        });
        e.billboard = new Cesium.BillboardGraphics({
          image: pinBuilder.fromText(String(i + 1), pinColor, 44).toDataURL(),
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM
        });
        e.point = undefined;
        e.label = new Cesium.LabelGraphics({
          text: e.name || ('Place ' + (i + 1)),
          font: '600 14px system-ui, sans-serif',
          fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -48),
          translucencyByDistance: new Cesium.NearFarScalar(4.0e6, 1.0, 1.6e7, 0.0)
        });
      });

      const title = (ds.name || 'Tour').replace(/\.km[lz]$/i, '');
      document.getElementById('tour-title').textContent = title;
      document.title = 'Earth Explorer · ' + title;
      buildList();
      setInfo(null);
      show('');
      prefetchHeights();
    } catch (err) {
      console.error(err);
      show('That file could not be opened. Make sure it is a .kmz or .kml from Google Earth.');
      setTimeout(() => show(''), 4000);
    }
  }

  function buildList() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    pins.forEach((e, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = '<span class="num"></span><span class="nm"></span>';
      b.querySelector('.num').textContent = i + 1;
      b.querySelector('.nm').textContent = e.name || ('Place ' + (i + 1));
      b.addEventListener('click', () => { viewer.selectedEntity = e; });
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  function cartoOf(e) {
    const g = groundOf.get(e);
    return g ? g.clone() : Cesium.Cartographic.fromCartesian(e.position.getValue(viewer.clock.currentTime));
  }

  async function terrainHeight(e) {
    if (heightCache.has(e)) return heightCache.get(e);
    const p = (async () => {
      if (!hasTerrain) return null;
      try {
        const [s] = await Cesium.sampleTerrainMostDetailed(terrainProvider, [cartoOf(e)]);
        if (!Number.isFinite(s.height)) return null;
        groundHeight.set(e, s.height);
        return s.height;
      } catch { return null; }
    })();
    heightCache.set(e, p);
    return p;
  }
  function prefetchHeights() { pins.forEach(terrainHeight); }

  function lookAtOf(e) {
    const la = (e.kml && e.kml.lookAt) || e.lookAt;
    return la && la.headingPitchRange ? la.headingPitchRange : null;
  }

  async function flyTo(e) {
    const c = cartoOf(e);
    const hpr = lookAtOf(e);
    const range = Math.max(hpr ? hpr.range : 50000, 600) * 1.15;
    const heading = hpr ? hpr.heading : 0;
    const h = await Promise.race([terrainHeight(e), new Promise(r => setTimeout(() => r(0), 1500))]);
    const center = Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, h || 0);
    viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(center, 1), {
      offset: new Cesium.HeadingPitchRange(heading, Cesium.Math.toRadians(DEFAULT_TILT - 90), range),
      duration: 3
    });
  }

  // ---------- Viewing angle (tilt / rotate / reset) ----------
  // Tilt is measured from straight down: 0° = looking straight down, 75° = looking toward the horizon.
  const DEFAULT_TILT = 50;        // the angle used when flying to a place
  const FAR_AWAY = 2500000;       // farther than this (m), "reset" means straight down at the whole globe
  const tiltEl = document.getElementById('tilt'), headEl = document.getElementById('heading');
  const tiltVal = document.getElementById('tilt-val'), headVal = document.getElementById('heading-val');
  let pivot = null, pivotTimer = null, dragging = false;

  // The spot on the ground at the middle of the screen; the view turns and tilts around it.
  function screenCenterOnGround() {
    const s = viewer.scene, cv = s.canvas;
    const mid = new Cesium.Cartesian2(cv.clientWidth / 2, cv.clientHeight / 2);
    return s.globe.pick(s.camera.getPickRay(mid), s) || s.camera.pickEllipsoid(mid);
  }
  function getPivot() {
    if (!pivot) pivot = screenCenterOnGround();
    clearTimeout(pivotTimer);
    pivotTimer = setTimeout(() => { pivot = null; }, 600);
    return pivot;
  }
  function setView(headingDeg, tiltDeg, animate) {
    const target = animate ? screenCenterOnGround() : getPivot();
    if (!target) return;
    const range = Cesium.Cartesian3.distance(viewer.camera.positionWC, target);
    const offset = new Cesium.HeadingPitchRange(Cesium.Math.toRadians(headingDeg), Cesium.Math.toRadians(tiltDeg - 90), range);
    if (animate) {
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(target, 0), { offset, duration: 0.9 });
    } else {
      viewer.camera.lookAt(target, offset);
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    }
  }
  const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  function showHeading(deg) {
    const d = ((Math.round(deg) % 360) + 360) % 360;
    headVal.textContent = DIRS[Math.round(d / 45) % 8];
    headVal.title = d + '° from north';
  }
  function syncControls() {
    if (dragging) return;
    const cam = viewer.camera;
    // Tilt = angle between "straight up" at the spot you're looking at and the line to the camera.
    const target = screenCenterOnGround();
    let tilt;
    if (target) {
      const up = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(target, new Cesium.Cartesian3());
      const toCam = Cesium.Cartesian3.normalize(
        Cesium.Cartesian3.subtract(cam.positionWC, target, new Cesium.Cartesian3()), new Cesium.Cartesian3());
      tilt = Math.round(Cesium.Math.toDegrees(Math.acos(Cesium.Math.clamp(Cesium.Cartesian3.dot(up, toCam), -1, 1))));
    } else {
      tilt = Math.round(90 + Cesium.Math.toDegrees(cam.pitch));
    }
    tilt = Cesium.Math.clamp(tilt, 0, 90);
    let head = Cesium.Math.toDegrees(cam.heading);
    if (head > 180) head -= 360;
    tiltEl.value = Math.min(tilt, 75); tiltVal.textContent = tilt + '°';
    headEl.value = Math.round(head); showHeading(head);
  }
  viewer.camera.percentageChanged = 0.001;
  viewer.camera.changed.addEventListener(syncControls);
  viewer.camera.moveEnd.addEventListener(syncControls);

  for (const el of [tiltEl, headEl]) {
    el.addEventListener('pointerdown', () => { dragging = true; });
    el.addEventListener('pointerup', () => { dragging = false; });
    el.addEventListener('change', () => { dragging = false; syncControls(); });
    el.addEventListener('input', () => {
      tiltVal.textContent = tiltEl.value + '°';
      showHeading(+headEl.value);
      setView(+headEl.value, +tiltEl.value, false);
    });
  }
  document.getElementById('north-up').addEventListener('click', () => setView(0, +tiltEl.value, true));
  document.getElementById('reset-view').addEventListener('click', () => {
    const target = screenCenterOnGround();
    const far = !target || Cesium.Cartesian3.distance(viewer.camera.positionWC, target) > FAR_AWAY;
    setView(0, far ? 0 : DEFAULT_TILT, true);
  });

  function fmt(deg, pos, neg) { return Math.abs(deg).toFixed(3) + '° ' + (deg >= 0 ? pos : neg); }

  async function setInfo(e) {
    const info = document.getElementById('info');
    document.querySelectorAll('#list button').forEach((b, i) => b.classList.toggle('active', pins[i] === e));
    if (!e) {
      info.innerHTML = pins.length
        ? '<div class="hint">Click a place in the list, or a pin on the globe, to fly there.</div>'
        : '<div class="hint">Use <b>Open KMZ…</b> to load a .kmz or .kml file saved from Google Earth.</div>';
      return;
    }
    const c = cartoOf(e);
    const lat = Cesium.Math.toDegrees(c.latitude), lon = Cesium.Math.toDegrees(c.longitude);
    info.innerHTML = '<h2></h2><div><span class="k">Location:</span> <span class="loc"></span></div>' +
      '<div><span class="k">Elevation (approx.):</span> <span class="elev">measuring…</span></div><div class="desc"></div>';
    info.querySelector('h2').textContent = e.name || '';
    info.querySelector('.loc').textContent = fmt(lat, 'N', 'S') + ', ' + fmt(lon, 'E', 'W');
    const desc = e.description && e.description.getValue(viewer.clock.currentTime);
    if (desc) {
      // KML descriptions are the teacher's own content; strip scripts as a precaution.
      const tmp = document.createElement('div');
      tmp.innerHTML = desc;
      tmp.querySelectorAll('script,iframe,object,embed').forEach(n => n.remove());
      info.querySelector('.desc').appendChild(tmp);
    }
    const h = await terrainHeight(e);
    if (viewer.selectedEntity === e) {
      if (h === null) { info.querySelector('.elev').textContent = 'not available'; return; }
      const m = Math.round(h);
      const ft = Math.round(h * 3.28084);
      info.querySelector('.elev').textContent =
        Math.abs(m).toLocaleString() + ' m (' + Math.abs(ft).toLocaleString() + ' ft)' +
        (m < 0 ? ' below sea level' : ' above sea level');
    }
  }

  viewer.selectedEntityChanged.addEventListener((e) => {
    if (e && pins.includes(e)) { setInfo(e); flyTo(e); }
    else if (!e) setInfo(null);
    else viewer.selectedEntity = undefined; // ignore clicks on anything that is not a pin
  });

  document.getElementById('home').addEventListener('click', () => {
    viewer.selectedEntity = undefined;
    viewer.camera.flyTo({ destination: WHOLE_EARTH, duration: 2.5 });
  });

  document.getElementById('file').addEventListener('change', (ev) => {
    const f = ev.target.files[0];
    if (f) loadTour(f);
    ev.target.value = '';
  });

  const panel = document.getElementById('panel');
  document.getElementById('toggle-panel').addEventListener('click', (ev) => {
    panel.classList.toggle('collapsed');
    ev.target.textContent = panel.classList.contains('collapsed') ? 'Show' : 'Hide';
  });

  show('');
})();
</script>
</body>
</html>
